name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compute build name
      run: |
        SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BUILD_NAME="PR-${{ github.event.number }}-${SHORT_SHA}"
        else
          BUILD_NAME="${GITHUB_REF_NAME}-${SHORT_SHA}"
        fi
        echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
        echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"

    - name: Build with Gradle Wrapper
      run: ./gradlew shadowJar
      env:
        BUILD_NUMBER: ${{ env.BUILD_NAME }}

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: DeluxeMenus build ${{ env.BUILD_NAME }}
        path: build/libs
        if-no-files-found: error

  dependency-submission:

    # Requires contents: write, which fork pull requests do not get.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
